[package]
name = "evac-registry"
version = "0.1.0"
edition = "2021"
description = "On-chain registry of exit manifests, kit hashes, site fingerprints and alarm status for the Evac DeFi fire exit"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "~5.20"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[dev-dependencies]
near-sdk = { version = "~5.20", features = ["unit-testing"] }
